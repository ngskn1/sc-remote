# Which ways of putting files on the clipboard Explorer accepts for Paste (test/windows/explorer-paste.mjs).
name: Windows Explorer paste check

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node test/windows/explorer-paste.mjs
