<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ScreenShare remote</title>
<script src="peerjs.min.js"></script>
<script src="remote-common.js"></script>
<script src="i18n.js"></script>
<style>
  :root { --bg: #0b0c10; --panel: #1a1d24; --line: #2a2e38; --text: #e6e8ee; --muted: #8b91a1; --accent: #5b8cff; --ok: #3ecf8e; --bad: #ff6b6b; --warn: #f5b84b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--text); font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
  button, select, input { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; }
  button { cursor: pointer; } button:hover { border-color: var(--accent); }
  button.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
  .hidden { display: none !important; }

  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #screen { width: 100%; height: 100%; object-fit: contain; background: #000; outline: none; cursor: default; }

  /* toolbar: slides down when the pointer reaches the top edge, or stays pinned */
  #bar { position: fixed; top: 0; left: 50%; transform: translate(-50%, calc(-100% + 4px)); transition: transform .15s ease;
         display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px; max-width: calc(100vw - 16px);
         background: rgba(20, 22, 28, .96); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 10px 10px; z-index: 5; }
  #bar.show, #bar.pinned, #bar:hover, #bar:focus-within { transform: translate(-50%, 0); }
  #bar .who { font-weight: 600; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }
  #lat { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; min-width: 90px; }
  .sep { width: 1px; height: 22px; background: var(--line); }
  label.chk { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .menu { position: relative; }
  .menu .items { position: absolute; top: calc(100% + 4px); left: 0; display: none; flex-direction: column; gap: 2px; padding: 4px;
                 background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 170px; z-index: 6; }
  .menu.open .items { display: flex; }
  .menu .items button { border: 0; text-align: left; background: transparent; }
  .menu .items button:hover { background: #262a33; }

  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.6); z-index: 4; }
  #overlay .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px 26px; max-width: 460px; text-align: center; display: flex; flex-direction: column; gap: 12px; }
  #overlay .msg { font-size: 15px; }
  #overlay.err .msg { color: var(--bad); }
  #retryBox { display: flex; gap: 8px; justify-content: center; }

  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line);
           border-radius: 8px; padding: 8px 14px; z-index: 7; max-width: 80vw; }

  /* files drawer */
  #files { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 92vw); background: rgba(20,22,28,.98); border-left: 1px solid var(--line);
           z-index: 6; display: flex; flex-direction: column; }
  #files header { display: flex; align-items: center; gap: 6px; padding: 10px; border-bottom: 1px solid var(--line); }
  #files header .tabs { flex: 1; display: flex; gap: 4px; min-width: 0; }
  #files header .tabs button { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: transparent; border-color: transparent; color: var(--muted); }
  #files header .tabs button.on { background: #232733; border-color: var(--line); color: var(--text); font-weight: 600; }
  #favBtn { font-size: 15px; padding: 2px 8px; } #favBtn.on { color: #f5c542; border-color: #f5c542; }
  #places { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  #places:empty { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 4px; max-width: 180px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 12px; font-size: 12px; cursor: pointer; background: #12141a; }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip:hover { border-color: var(--accent); } .chip.star { border-color: #5a4d1f; }
  .chip .x { color: var(--muted); padding: 0 2px; } .chip .x:hover { color: var(--bad); }
  .ent .go { visibility: hidden; padding: 1px 8px; font-size: 12px; } .ent:hover .go { visibility: visible; }
  #filesFoot { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  #footText { flex: 1; min-width: 0; display: flex; gap: 4px; align-items: center; white-space: nowrap; }
  #footText .p { min-width: 0; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; color: var(--text); }  /* long paths: cut on the left */
  #footText a { flex: none; color: var(--accent); cursor: pointer; }
  #pathbar { display: flex; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); align-items: center; }
  #path { flex: 1; min-width: 0; }
  #list { flex: 1; overflow: auto; padding: 4px 0; }
  .ent { display: flex; align-items: center; gap: 8px; padding: 6px 12px; cursor: pointer; }
  .ent:hover { background: #232733; }
  .ent .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ent .s { color: var(--muted); font-size: 12px; white-space: nowrap; }
  #transfers { border-top: 1px solid var(--line); max-height: 35%; overflow: auto; }
  .tr { padding: 6px 12px; display: flex; flex-direction: column; gap: 4px; border-bottom: 1px solid var(--line); }
  .tr .top { display: flex; gap: 8px; align-items: center; }
  .tr .top span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tr progress { width: 100%; height: 6px; }
  .tr a { color: var(--accent); cursor: pointer; }
  #acts { position: fixed; left: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 7; max-width: min(460px, 80vw); }
  .act { background: rgba(26,29,36,.97); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; display: flex; flex-direction: column; gap: 5px; }
  .act .top { display: flex; gap: 10px; align-items: center; }
  .act .top span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .act a { color: var(--accent); cursor: pointer; white-space: nowrap; }
  .act progress { width: 100%; height: 5px; }
  .act.ok { border-color: var(--ok); } .act.bad { border-color: var(--bad); }
  #auditBox { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 9; display: flex; align-items: center; justify-content: center; }
  #auditBox .abox { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; width: min(820px, 94vw); max-height: 80vh; display: flex; flex-direction: column; }
  #auditBox header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  #auditBox .ascroll { overflow: auto; padding: 6px 14px 14px; }
  #auditBox table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  #auditBox td, #auditBox th { text-align: left; padding: 4px 8px; border-bottom: 1px solid #262a33; white-space: nowrap; }
  #drop { position: fixed; inset: 0; border: 3px dashed var(--accent); background: rgba(91,140,255,.12); z-index: 8; display: flex;
          align-items: center; justify-content: center; font-size: 20px; pointer-events: none; }
</style>
</head>
<body>
<div id="stage"><video id="screen" autoplay playsinline muted tabindex="0"></video></div>

<div id="bar">
  <span class="who"><span class="dot" id="dot"></span><span id="who">…</span></span>
  <span id="lat"></span>
  <span class="sep"></span>
  <select id="display" title="Which screen to show"></select>
  <select id="quality" title="Sharp keeps text crisp; Smooth keeps motion fluid on slow connections">
    <option value="sharp">Sharp text</option><option value="smooth">Smooth</option>
  </select>
  <select id="fps" title="Frames per second"><option>15</option><option selected>30</option><option>60</option></select>
  <select id="codec" title="Video codec"><option value="VP8">VP8</option><option value="H264">H.264</option><option value="VP9">VP9</option></select>
  <span class="sep"></span>
  <label class="chk" title="Copy on one computer, paste on the other (text and images)"><input type="checkbox" id="clip" checked> Clipboard</label>
  <button id="filesBtn" title="Browse the remote PC's files, download, upload (or drop files on this window)">Files</button>
  <div class="menu" id="keysMenu"><button id="keysBtn" title="Send keys this computer would otherwise catch">Keys ▾</button>
    <div class="items">
      <button data-keys="ControlLeft AltLeft Delete">Ctrl + Alt + Del</button>
      <button data-keys="AltLeft Tab">Alt + Tab</button>
      <button data-keys="MetaLeft">Windows / Super key</button>
      <button data-keys="AltLeft F4">Alt + F4</button>
      <button data-keys="PrintScreen">Print Screen</button>
      <button data-keys="ControlLeft AltLeft KeyL">Ctrl + Alt + L (lock)</button>
    </div>
  </div>
  <button id="fs" title="Fullscreen (in fullscreen, Alt+Tab and the Windows key go to the remote PC; hold Esc to leave)">Fullscreen</button>
  <button id="auditBtn" class="hidden" title="Who connected to this PC, and when (lab admins)">Log</button>
  <label class="chk" title="Keep this toolbar visible"><input type="checkbox" id="pin"> Pin</label>
  <button id="disc" class="danger">Disconnect</button>
</div>

<div id="overlay"><div class="box">
  <div class="msg" id="omsg">Connecting…</div>
  <div id="retryBox" class="hidden"><input id="pw" type="password" placeholder="Password"><button id="retry">Connect</button></div>
  <div id="againBox" class="hidden"><button id="trust" class="hidden">Trust the new identity</button> <button id="again">Connect again</button> <button id="closeWin">Close</button></div>
</div></div>

<div id="files" class="hidden">
  <header>
    <div class="tabs"><button id="tabRemote" class="on"><span id="fname"></span></button><button id="tabLocal">On this computer</button></div>
    <button id="closeFiles">✕</button>
  </header>
  <div id="pathbar"><button id="parent" title="Up one folder">↑</button><button id="homeBtn" title="Home folder">⌂</button><input id="path" spellcheck="false"><button id="favBtn" class="fav" title="Add this folder to favorites">☆</button></div>
  <div id="places"></div>
  <div id="list"></div>
  <div id="filesFoot"><span id="footText"></span><button id="footBtn"></button></div>
  <div id="transfers"></div>
  <input type="file" id="picker" multiple class="hidden">
</div>
<div id="drop" class="hidden">Release where you want the files on the remote PC</div>
<div id="acts"></div>
<div id="toast" class="hidden"></div>
<div id="auditBox" class="hidden"><div class="abox">
  <header><b>Connection log of this PC</b><button id="closeAudit">✕</button></header>
  <div class="ascroll"><table><thead><tr><th>When</th><th>What</th><th>Who</th><th></th></tr></thead><tbody id="auditRows"></tbody></table></div>
</div></div>

<script>
'use strict';
const R = window.remoteApp;
const $ = id => document.getElementById(id);
const video = $('screen');
const store = (() => { try { return JSON.parse(localStorage.getItem('remote-session-prefs')) || {}; } catch { return {}; } })();
const q = { fps: store.fps || 30, sharp: store.sharp !== false, codec: store.codec || 'VP8', clip: store.clip !== false };
const savePrefs = () => { try { localStorage.setItem('remote-session-prefs', JSON.stringify(q)); } catch {} };
$('fps').value = q.fps; $('quality').value = q.sharp ? 'sharp' : 'smooth'; $('codec').value = q.codec; $('clip').checked = q.clip;

let creds = null, peer = null, ctl = null, token = null, call = null, pendingCall = null;
let displays = [], current = 0, wantDisplay = null, ended = false, retries = 0, retryTimer = null, hostName = '';
let hostOs = '', myRole = null, pendingHostKey = null, hostCaps = {}, expectProof = null, stalls = 0;

/* ---------------- ui helpers ---------------- */
// mode: 'password' asks for it again; 'again' offers to reconnect after the other side ended the session
function overlay(text, kind = '', mode = '') {
  if (mode === true) mode = 'password';
  $('overlay').classList.toggle('hidden', !text);
  $('overlay').classList.toggle('err', kind === 'err');
  $('omsg').textContent = t(text || '');             // (messages from the other PC are in English: translated here)
  $('againBox').classList.toggle('hidden', mode !== 'again' && mode !== 'trust');
  $('trust').classList.toggle('hidden', mode !== 'trust');
  const askPassword = mode === 'password';
  $('retryBox').classList.toggle('hidden', !askPassword);
  if (askPassword) setTimeout(() => $('pw').focus(), 50);
}
function dot(kind) { $('dot').className = 'dot ' + kind; }
let toastTimer = null;
function toast(text, ms = 4000) { $('toast').textContent = t(text); $('toast').classList.remove('hidden'); clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').classList.add('hidden'), ms); }
const send = m => { if (ctl && ctl.open && token) ctl.send(m); };

/* ---------------- connection ---------------- */
function connect() {
  clearTimeout(retryTimer);
  // detach first: destroying the old peer fires its connections' close events, which must not count as "lost"
  const old = peer;
  peer = null; ctl = null; token = null; pendingCall = null;
  if (old && !old.destroyed) old.destroy();
  dot('warn');
  const p = peer = new Peer(peerOptions());
  p.on('open', () => {
    const c = ctl = p.connect(creds.peerId, { label: 'ctl', serialization: 'binary', reliable: true });
    let greeted = false;
    c.on('data', m => { if (!greeted) { greeted = true; stalls = 0; } onControl(c, m); });
    // now and then a connection never gets going: start over instead of waiting for the other PC to give up (20 s)
    setTimeout(() => {
      if (greeted || ctl !== c || peer !== p || ended) return;
      stalls++; peer = null; ctl = null;
      try { p.destroy(); } catch {}
      connect();
    }, [10000, 15000, 20000][Math.min(stalls, 2)]);
    c.on('close', () => { if (ctl === c && peer === p) lost(); });
    c.on('error', () => {});
  });
  p.on('call', c => {
    if (!token) { pendingCall = c; return; }           // arrived before the sign-in reply: decide once it's in
    takeCall(c);
  });
  p.on('error', e => {
    if (peer !== p) return;
    // once connected, the session runs directly between the PCs: a signaling-server hiccup doesn't matter
    if (token && ctl && ctl.open && ['network', 'server-error', 'socket-error', 'socket-closed', 'disconnected'].includes(e.type)) {
      setTimeout(() => { if (peer === p && !p.destroyed && p.disconnected) p.reconnect(); }, 3000);
      return;
    }
    if (e.type === 'peer-unavailable') lost(creds.mode === 'lab'
      ? `${creds.pc} isn't reachable: it's off or offline, the name doesn't match its computer name, or it isn't set up as a lab PC (no ScreenShare Remote agent running on it).`
      : t('{0} is offline (PC off or asleep, or ScreenShare not running).', creds.name || creds.id));
    else lost(t('Connection problem ({0}).', e.type));
  });
  p.on('disconnected', () => { setTimeout(() => { if (peer === p && !p.destroyed && p.disconnected) p.reconnect(); }, 1000); });
}

function takeCall(c) {
  if (!c.metadata || c.metadata.token !== token) { try { c.close(); } catch {} return; }
  const prev = call; call = c;
  c.answer(undefined, { sdpTransform: s => remoteSdp(s, q.codec, q.sharp ? 12000 : 6000) });
  c.on('stream', st => {
    if (call !== c) return;
    if (video.srcObject !== st) { video.srcObject = st; video.play().catch(() => {}); }
    c.peerConnection.getReceivers().forEach(r => { try { r.jitterBufferTarget = 0; } catch {} try { r.playoutDelayHint = 0; } catch {} });
    overlay(null); dot('ok'); retries = 0;
    video.focus();
  });
  c.on('close', () => { if (call === c) call = null; });
  if (prev) setTimeout(() => { try { prev.close(); } catch {} }, 300);
}

async function onControl(c, m) {
  if (!m || typeof m !== 'object' || c !== ctl) return;
  // until the other side is signed in (and has proved it's the right PC), nothing else it says counts
  if (!token && !['hello', 'ok', 'denied', 'bye'].includes(m.t)) return;
  switch (m.t) {
    case 'hello': {
      hostName = m.name || '';
      overlay('Signing in…');
      const prefs = { fps: q.fps, sharp: q.sharp, codec: q.codec, clip: q.clip };
      if (wantDisplay != null) prefs.display = wantDisplay;
      if (creds.mode === 'lab') {
        if (m.mode !== 'lab' || m.labId !== creds.labId) { ended = true; overlay(`That is not ${creds.pc} of ${creds.lab}.`, 'err', 'again'); return; }
        hostOs = m.os;
        const r = await labSignIn(c, m, creds, 'session', prefs);
        if (!r.ok) {
          ended = true; dot('bad');
          if (r.changed) { pendingHostKey = m.hostKey; overlay(r.reason, 'err', 'trust'); }
          else overlay(r.reason, 'err', 'again');
          try { c.close(); } catch {}
        }
        return;
      }
      hostCaps = m.caps || {};
      expectProof = null;
      const stop = text => { ended = true; dot('bad'); overlay(text, 'err', 'again'); try { c.close(); } catch {} };
      // The sign-in is SRP (remote/srp.js): tied to this encrypted connection, both sides prove that they know
      // the password, and neither gets anything to test password guesses against. A PC that doesn't offer it
      // (an old version, or something pretending to be that PC) gets nothing at all.
      if (!hostCaps.bound || !hostCaps.pake || typeof m.pake !== 'string') return stop(t('That PC runs an older version, without the current sign-in. Update it first (SC-Remote 1.4 / ScreenShare 2.5 or newer).'));
      const [mine, theirs] = dtlsFingerprints(c);
      if (!mine || !theirs || !/^[0-9a-f]{64}$/.test(m.nonce || '') || !/^[0-9a-f]{16,128}$/.test(m.salt || '')) return stop(t('Could not read the connection\'s security details.'));
      let p;
      try { p = await R.pakeAnswer({ password: creds.password, salt: m.salt, nonce: m.nonce, B: m.pake, hostFp: theirs, clientFp: mine }); } catch (e) { overlay(t('Sign-in failed: ') + e.message, 'err'); return; }
      if (c !== ctl) return;
      if (!p) return stop(t('Could not read the connection\'s security details.'));
      expectProof = p.m2;
      c.send({ t: 'auth', pake: { A: p.A, m1: p.m1 }, bound: true, name: creds.me || 'remote PC', ...prefs });   // prefs include the screen you were on
      break;
    }
    case 'ok':
      if (creds.mode !== 'lab') {
        const want = expectProof; expectProof = null;
        if (!want || m.proof !== want) {      // it accepted the password without knowing it: not the real PC
          ended = true; dot('bad');
          overlay(t('That computer accepted the sign-in but could not prove that it knows the password, so it may not be the real PC. Nothing was sent to it. If this keeps happening, change that PC\'s password.'), 'err', 'again');
          try { c.close(); } catch {}
          return;
        }
      }
      token = m.token; displays = m.displays || []; current = m.current; hostName = m.name || hostName; hostOs = m.os || hostOs;
      if (m.policy) R.labOffer(creds.labId, m.policy);          // the PC had a newer lab policy: keep it
      if (creds.mode === 'lab') R.labRemember(creds.labId, hostName || creds.pc);   // connection history
      else R.signedIn(creds.password);                         // save the PC / its password only now that it worked
      myRole = m.role || null;
      $('auditBtn').classList.toggle('hidden', myRole !== 'admin');
      if (m.allow) {                                              // the lab may turn clipboard / files off
        if (!m.allow.clipboard) { q.clip = false; $('clip').checked = false; $('clip').disabled = true; $('clip').parentElement.title = 'Turned off for this lab'; }
        if (!m.allow.files) { $('filesBtn').disabled = true; $('filesBtn').title = 'Turned off for this lab'; }
      }
      fillDisplays();
      overlay('Starting video…');
      R.clipWatch(q.clip);
      if (pendingCall) { const pc = pendingCall; pendingCall = null; takeCall(pc); }
      break;
    case 'denied':
      ended = true; dot('bad');
      overlay(m.reason || 'Access denied', 'err', /password/i.test(m.reason || '') ? 'password' : 'again');
      break;
    case 'bye':
      ended = true; dot('bad'); cleanupVideo();
      overlay(m.reason || 'Disconnected', '', 'again');
      break;
    case 'display': current = m.i; wantDisplay = m.i; $('display').value = String(m.i); break;
    case 'clip': if (q.clip) R.clipSet({ kind: m.kind, data: m.kind === 'image' ? toBytes(m.data) : String(m.data) }); break;
    case 'pong': rtt = Math.round(performance.now() - m.ts); lastPong = performance.now(); break;
    case 'notice': toast(m.text, 8000); R.log('notice from the other PC: ' + m.text); break;
    case 'audit': showAudit(m.items || []); break;
    case 'desktop': toast(m.name === 'Default' ? 'Back on the desktop' : 'Showing the sign-in / lock / administrator prompt screen', 5000); break;
    case 'clip-files': receiveClipFiles(m); break;
    case 'drop-result':
      if (pendingDrop) {
        const a = pendingDrop; pendingDrop = null;
        if (m.ok) a.done(t('Dropped {0} item(s) on {1}. If they didn\'t land where you wanted, press Ctrl+V there.', m.n, hostLabel()), 9000);
        else a.fail(t('Couldn\'t drop there ({0}). They\'re on {1}\'s clipboard: press Ctrl+V there.', t(m.reason), hostLabel()));
      }
      break;
  }
}

function lostByTimeout() {
  const old = peer; peer = null; ctl = null;          // detach, so its close events aren't counted twice
  if (old && !old.destroyed) old.destroy();
  lost('The connection stopped responding.');
}
function lost(reason) {
  token = null;
  R.clipWatch(false);
  if (ended) return;
  cleanupVideo();
  dot('bad');
  const wait = Math.min(5000, 1500 * 2 ** Math.min(retries++, 2));     // 1.5 s, 3 s, then every 5 s
  overlay(t('{0} Reconnecting in {1} s…', t(reason || 'Connection lost.'), Math.round(wait / 1000)));
  clearTimeout(retryTimer);
  retryTimer = setTimeout(connect, wait);
}
function cleanupVideo() { video.srcObject = null; if (call) { try { call.close(); } catch {} call = null; } }

function fillDisplays() {
  $('display').replaceChildren(...displays.map(d => new Option(d.label, String(d.i))));
  $('display').value = String(current);
  $('display').classList.toggle('hidden', displays.length < 2);
}

/* ---------------- toolbar ---------------- */
$('display').onchange = () => { wantDisplay = +$('display').value; send({ t: 'display', i: wantDisplay }); };
$('quality').onchange = () => { q.sharp = $('quality').value === 'sharp'; savePrefs(); send({ t: 'quality', sharp: q.sharp }); };
$('fps').onchange = () => { q.fps = +$('fps').value; savePrefs(); send({ t: 'quality', fps: q.fps }); };
$('codec').onchange = () => { q.codec = $('codec').value; savePrefs(); send({ t: 'quality', codec: q.codec }); toast('Switching codec…', 2000); };

// position inside the visible picture (the video is letterboxed with object-fit: contain)
function norm(e) {
  const r = video.getBoundingClientRect(), vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return null;
  const s = Math.min(r.width / vw, r.height / vh), w = vw * s, h = vh * s;
  const x = (e.clientX - r.left - (r.width - w) / 2) / w, y = (e.clientY - r.top - (r.height - h) / 2) / h;
  return { x: Math.min(Math.max(x, 0), 1), y: Math.min(Math.max(y, 0), 1), inside: x >= 0 && x <= 1 && y >= 0 && y <= 1 };
}
let movePending = null;
video.addEventListener('pointermove', e => {
  const p = norm(e); if (!p) return;
  if (!movePending) requestAnimationFrame(() => { if (movePending) send({ t: 'm', x: movePending.x, y: movePending.y }); movePending = null; });
  movePending = p;
});
const BTN = { 0: 1, 1: 2, 2: 3, 3: 8, 4: 9 };
video.addEventListener('pointerdown', e => {
  const p = norm(e); if (!p || !p.inside) return;
  e.preventDefault(); video.focus(); video.setPointerCapture(e.pointerId);
  send({ t: 'm', x: p.x, y: p.y }); movePending = null;
  send({ t: 'b', b: BTN[e.button], d: 1 });
});
video.addEventListener('pointerup', e => {
  const p = norm(e); if (p) send({ t: 'm', x: p.x, y: p.y }); movePending = null;

// wheel: turn pixels into notches (Chromium reports ~100 px per notch on Windows, ~53 on Linux); touchpads add up
const NOTCH = R.platform === 'win32' ? 100 : 53;
let acc = { x: 0, y: 0 };
video.addEventListener('wheel', e => {
  e.preventDefault();
  const k = e.deltaMode === 1 ? NOTCH / 3 : e.deltaMode === 2 ? NOTCH * 10 : 1;
  acc.x += e.deltaX * k; acc.y += e.deltaY * k;
  const dx = Math.trunc(acc.x / NOTCH), dy = Math.trunc(acc.y / NOTCH);

// the Windows key is in the Keys menu. macOS doesn't report a key's release while Cmd is held, so with Cmd down

// turns off: each of those is a full press on the other PC.
const MAC = R.platform === 'darwin';

async function pushWalk(w, dest, a, stale = () => false) {

    const id = await request({ op: 'put', base, rel, size: it.size }, { first: first.resolve, done: done.resolve, fail: e => { first.reject(e); done.reject(e); } });

    try {
      for (let off = 0; off < f.size; ) {
        if (a.cancelled || stale()) { cancel = true; break; }
        const data = await R.fsRead(f.handle, off, CHUNK);
        if (!data.length) break;

}

// fetch remote files/folders (as described by the remote PC) into a fresh staging folder here
// (base, names: into that folder on this PC, with the top-level items renamed as given)
async function pullItems(m, a, stale = () => false, base = null, names = null) {
  base = base || await R.fsStage();
  const map = {}; if (names) m.roots.forEach((r, i) => { map[r] = names[i]; });
  const remap = rel => { const i = rel.indexOf('/'); const top = i < 0 ? rel : rel.slice(0, i); return (map[top] || top) + (i < 0 ? '' : rel.slice(i)); };
  let got = 0;
  for (const it of m.items) {
    if (a.cancelled || stale()) throw new Error('cancelled');
    if (it.dir) { await R.fsMkdirRel(base, remap(it.rel)); continue; }
    const f = await R.fsOpenWriteRel(base, remap(it.rel));
    let writes = Promise.resolve();
    try {
      await new Promise((resolve, reject) => {
        request({ op: 'get', path: it.path }, {
          first: () => {},
          chunk: d => { got += d.length; a.set(m.total ? got / m.total : 1); writes = writes.then(() => R.fsWrite(f.handle, d)); },
          done: r => writes.then(() => (r.cancelled ? reject(new Error('cancelled')) : resolve()), reject),
          fail: reject,
        }).then(id => { a.cancelRemote = () => fconn && fconn.send({ op: 'cancel', id }); }, reject);
      });
    } finally { await R.fsClose(f.handle); }
  }
  return R.fsJoin(base, m.roots.map(r => map[r] || r));
}

// Files panel: a whole folder from the remote PC into the download folder
async function downloadFolder(p) {
  await loadFilePrefs();
  const dir = dlDir;
  const a = activity(t('⬇ Downloading {0}…', baseName(p)));
  try {
    const w = await rpc({ op: 'walk', paths: [p] });
    const names = await R.fsUnique(dir, w.roots);
    await pullItems(w, a, () => false, dir, names);
    a.done(t('⬇ Downloaded {0} to {1}', describe({ ...w, roots: names }), dir));
  } catch (e) { e.message === 'cancelled' ? a.fail(t('Download cancelled')) : a.fail(t('Download failed: ') + e.message); }
}
// "this computer" tab: send a file or folder into the folder open on the remote tab
async function uploadFromHere(p) {
  if (!cwd) await openDir('');
  if (!cwd) return;
  await uploadInto([p], cwd);
}

// Ctrl+C on this PC → files go to the remote PC and onto its clipboard
async function sendClipFiles(paths) {
  const gen = ++clipGen;
  let w;
  try { w = await R.fsWalk(paths); } catch (e) { toast(t('Could not read the copied files: ') + e.message); return; }
  if (w.total > CLIP_LIMIT) { toast(t('The copied files are {0}, too big to send through the clipboard. Use Files ▸ Upload.', fmtBytes(w.total)), 9000); return; }
  const a = activity(t('📋 Copying {0} to {1}…', describe(w), hostLabel()));
  try {
    const { base, roots } = await pushWalk(w, 'stage', a, () => gen !== clipGen);
    send({ t: 'clip-files', base, roots });
    a.done(t('📋 Ready: press Ctrl+V on {0} to paste {1}', hostLabel(), describe(w)));
  } catch (e) { e.message === 'cancelled' ? a.fail(t('Copy cancelled')) : a.fail(t('Copy failed: ') + e.message); }
}

// Ctrl+C on the remote PC → files come here and onto this clipboard
async function receiveClipFiles(m) {
  if (!q.clip) return;
  const gen = ++pullGen;
  if (m.total > CLIP_LIMIT) { toast(t('Files copied on {0} are {1}, too big for the clipboard. Use the Files panel.', hostLabel(), fmtBytes(m.total)), 9000); return; }
  const a = activity(t('📋 Getting {0} from {1}…', describe(m), hostLabel()));
  try {
    const paths = await pullItems(m, a, () => gen !== pullGen);
    await R.clipSet({ kind: 'files', paths });
    a.done(t('📋 Ready: press Ctrl+V here to paste {0}', describe(m)));
  } catch (e) { e.message === 'cancelled' ? a.fail(t('Copy cancelled')) : a.fail(t('Copy failed: ') + e.message); }
}

// Files panel: upload into the folder that's open there
async function uploadInto(paths, dir) {
  let w;
  try { w = await R.fsWalk(paths); } catch (e) { toast(t('Could not read: ') + e.message); return; }
  const a = activity(t('⬆ Uploading {0}…', describe(w)));
  try {
    const r = await pushWalk(w, dir, a);
    a.done(t('⬆ Uploaded {0} to {1}', describe(w), dir));
    if (dir === cwd) openDir(cwd);
    return r;
  } catch (e) { e.message === 'cancelled' ? a.fail(t('Upload cancelled')) : a.fail(t('Upload failed: ') + e.message); }
}

// Drop on the remote screen: send, then the remote PC drops them where you released
async function dropOnRemote(paths, x, y) {
  let w;
  try { w = await R.fsWalk(paths); } catch (e) { toast(t('Could not read: ') + e.message); return; }
  const a = activity(t('⬆ Sending {0} to {1}…', describe(w), hostLabel()));
  try {
    const { base, roots } = await pushWalk(w, 'stage', a);
    a.set(1, t('Dropping {0} on {1}…', describe(w), hostLabel()));
    pendingDrop = a;
    send({ t: 'drop-files', base, roots, x, y });
  } catch (e) { e.message === 'cancelled' ? a.fail(t('Cancelled')) : a.fail(t('Failed: ') + e.message); }
}

$('filesBtn').onclick = async () => {
  $('files').classList.toggle('hidden');
  if ($('files').classList.contains('hidden')) return;
  await loadFilePrefs();
  if (!cwd) openFirstDir();
  render();
};
$('closeFiles').onclick = () => { $('files').classList.add('hidden'); video.focus(); };
$('tabRemote').onclick = () => showTab('remote');
$('tabLocal').onclick = () => showTab('local');
const openHere = p => (view === 'remote' ? openDir(p) : openLocal(p));
$('parent').onclick = () => $('parent').dataset.p && openHere($('parent').dataset.p);
$('homeBtn').onclick = () => (view === 'remote' ? openDir(home || '') : openLocal(''));
$('path').addEventListener('keydown', e => { if (e.key === 'Enter') openHere($('path').value); });
$('favBtn').onclick = () => { const d = view === 'remote' ? remoteView : local; if (d) toggleFav(d.path); };
$('picker').onchange = () => {
  const paths = [...$('picker').files].map(f => R.pathForFile(f)).filter(Boolean);
  $('picker').value = '';
  if (paths.length && cwd) uploadInto(paths, cwd);
};
// drop files anywhere on the window
let dragDepth = 0;
addEventListener('dragenter', e => { if ([...e.dataTransfer.types].includes('Files')) { dragDepth++; $('drop').classList.remove('hidden'); e.preventDefault(); } });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('drop').classList.add('hidden'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', async e => {
  e.preventDefault(); dragDepth = 0; $('drop').classList.add('hidden');
  if (!token) return toast('Not connected');
  const paths = [...e.dataTransfer.files].map(f => R.pathForFile(f)).filter(Boolean);
  if (!paths.length) return toast('Drop files or folders from this PC.');
  // onto the Files panel: into the folder shown there
  if (!$('files').classList.contains('hidden') && $('files').contains(e.target)) {
    if (!cwd) await openDir('');
    uploadInto(paths, cwd);
    return;
  }
  // onto the remote screen: exactly where it was released
  const p = norm(e);
  dropOnRemote(paths, p ? p.x : 0.5, p ? p.y : 0.5);
});

/* ---------------- start ---------------- */
(async () => {
  // language first (texts on the page, then everything shown later)
  const info = await R.appInfo().catch(() => null);
  if (info) { I18N.setLang(info.lang); I18N.translatePage(); }
  creds = await R.creds();
  if (!creds) { overlay('Nothing to connect to.', 'err'); return; }
  $('who').textContent = creds.mode === 'lab' ? creds.name : (creds.name || creds.id.replace(/(\d{3})(?=\d)/g, '$1 '));
  $('fname').textContent = t('On {0}', creds.mode === 'lab' ? creds.pc : (creds.name || creds.id));
  if (creds.mode === 'lab') window.__net = { server: creds.settings.server, turn: creds.settings.turn };
  connect();
})();
</script>
