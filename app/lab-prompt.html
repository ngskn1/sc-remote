<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>SC-Remote</title>
<script src="i18n.js"></script>
<style>
  :root { --bg: #1a1d24; --line: #2a2e38; --text: #e6e8ee; --muted: #8b91a1; --accent: #5b8cff; --ok: #3ecf8e; --bad: #ff6b6b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13.5px/1.4 system-ui, "Segoe UI", sans-serif; overflow: hidden; user-select: none; }
  button { font: inherit; color: var(--text); background: #12141a; border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.bad { border-color: var(--bad); color: var(--bad); }
  button.ok { background: var(--ok); border-color: var(--ok); color: #0b1a12; font-weight: 600; }
  /* banner: a thin bar, draggable, that stays on top while someone is connected */
  #banner { height: 100%; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 14px; border: 1px solid var(--bad); border-radius: 8px; -webkit-app-region: drag; }
  #banner button { -webkit-app-region: no-drag; }
  .rec { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); flex: none; animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .grow { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .muted { color: var(--muted); }
  /* consent */
  #consent { height: 100%; padding: 14px 16px; border: 1px solid var(--accent); border-radius: 8px; display: flex; flex-direction: column; gap: 10px; }
  #consent .row { display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-top: auto; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="banner" class="hidden">
  <span class="rec"></span>
  <span class="grow"><b id="bName"></b> <span class="muted">is controlling this PC</span></span>
  <button id="end" class="bad hidden" title="Disconnect them now">End</button>
</div>
<div id="consent" class="hidden">
  <div><b id="cName"></b> <span id="cFrom"><span class="muted">from</span> <b id="cLab"></b></span> <span class="muted">wants to control this PC (mouse, keyboard and screen).</span></div>
  <div class="row"><span class="muted grow" id="left"></span><button id="deny">Decline</button><button id="allow" class="ok">Allow</button></div>
</div>
<script>
const R = window.remoteApp;
const $ = id => document.getElementById(id);
(async () => {
  const s = await R.promptInfo();
  if (!s) return;
  I18N.setLang(s.lang); I18N.translatePage();
  document.title = s.product || document.title;
  if (s.kind === 'banner') {
    $('banner').classList.remove('hidden');
    $('bName').textContent = s.name;
    document.title = t('{0} is controlling this PC', s.name);
    $('banner').title = t('{0} is connected with {1}', s.lab ? `${s.name} (${s.lab})` : s.name, s.product || 'SC-Remote');
    if (s.canEnd) { $('end').classList.remove('hidden'); $('end').onclick = () => R.promptAnswer('end'); }
  } else {
    $('consent').classList.remove('hidden');
    $('cName').textContent = s.name; $('cLab').textContent = s.lab;
    if (!s.lab) $('cFrom').remove();
    let left = s.seconds || 30;
    const tick = () => { $('left').textContent = t('Declines by itself in {0} s', left); if (left-- <= 0) R.promptAnswer('deny'); };
    tick(); setInterval(tick, 1000);
    $('allow').onclick = () => R.promptAnswer('allow');
    $('deny').onclick = () => R.promptAnswer('deny');
  }
})();
</script>
</body>
</html>
